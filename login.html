<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visa Check</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#131720; --panel2:#181d29; --border:#232938;
    --text:#e9edf5; --muted:#8993a8; --accent:#4f8cff; --accent2:#33d17a;
    --warn:#ffb454; --danger:#ff5c6c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  header{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand img{height:28px; width:auto; display:block}
  .brand span{font-weight:600; letter-spacing:.2px}
  main{width:100%; max-width:480px; padding:32px 20px 60px; flex:1}
  .eyebrow{font-size:12px; letter-spacing:.12em; color:var(--accent); text-transform:uppercase; font-weight:600}
  h1{font-size:26px; margin:8px 0 6px; line-height:1.2}
  .sub{color:var(--muted); font-size:14px; margin:0 0 28px}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:22px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:15px; outline:none;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%; margin-top:16px; padding:13px 14px; border-radius:10px; border:none;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  .hint{font-size:12px; color:var(--muted); margin-top:10px}
  .result{display:none; margin-top:18px; padding:16px; border-radius:12px; border:1px solid var(--border)}
  .result.show{display:block}
  .status-row{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .dot{width:9px; height:9px; border-radius:50%}
  .status-approved .dot{background:var(--accent2)}
  .status-review .dot{background:var(--warn)}
  .status-notfound .dot{background:var(--danger)}
  .status-label{font-weight:600; font-size:15px}
  .status-detail{font-size:13px; color:var(--muted); margin:0}
  footer{color:var(--muted); font-size:12px; padding:20px; text-align:center}
</style>
</head>

<main>
  <span class="eyebrow">Application status</span>
  <h1>Check your visa status</h1>
  <p class="sub">Sign in with your account to check your application status.</p>

  <div class="card">
    <label for="email">Email or username</label>
    <input id="email" type="text" placeholder="Enter your email or username" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">

    <button onclick="checkStatus()">Check status</button>
    <p class="hint">Enter your account credentials to continue.</p>

    <div id="result" class="result">
      <div class="status-row">
        <span class="dot"></span>
        <span class="status-label" id="statusLabel"></span>
      </div>
      <p class="status-detail" id="statusDetail"></p>
    </div>
  </div>
</main>

<footer>Visa Check</footer>

<script>
function checkStatus(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const result = document.getElementById('result');
  const label = document.getElementById('statusLabel');
  const detail = document.getElementById('statusDetail');

  result.classList.remove('status-approved','status-review','status-notfound');
  result.classList.add('show');

  if(!email || !password){
    result.classList.add('status-notfound');
    label.textContent = 'Login required';
    detail.textContent = 'Enter your email or username and password to continue.';
    return;
  }

  result.classList.add('status-approved');
  label.textContent = 'Access verified';
  detail.textContent = 'Your credentials have been accepted. Your application status is available.';
}
</script>

<script>
(function () {
  const USERNAME = "monir1283";
  const PASSWORD = "Monir@7575";
  const PDF_FILE = "person.pdf";

  const form = document.querySelector("form");
  const inputs = document.querySelectorAll("input");
  const button = document.querySelector("button");

  if (!form || inputs.length < 2 || !button) return;

  const usernameInput = inputs[0];
  const passwordInput = inputs[1];

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    if (usernameInput.value === USERNAME && passwordInput.value === PASSWORD) {
      window.location.href = PDF_FILE;
    } else {
      alert("Invalid username or password.");
      passwordInput.focus();
    }
  });
})();
</script>
